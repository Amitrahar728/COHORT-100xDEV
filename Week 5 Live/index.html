<body>
    <h1>POSTS</h1>
    <div id = "posts"></div>
    <button onclick ="getrecentpost">Fetch new post</button>
    <script>

        // the way to send requests to the web browser 
        async function getrecentpost(){
            const response = await fetch("https://jsonplaceholder.typicode.com/posts/1")
            const data = await response.json();
            console.log(data);
            document.getElementById("posts").innerHTML = data.body.title
        }

        // getrecentpost();
    </script>
