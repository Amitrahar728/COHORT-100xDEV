<!-- State derived frontends -->

<!-- Updating dom was very tidious task for good developers so companies start state and components -->
<!-- state: the variable part of the frontend  -->
 <!-- component : how to render state on screen  -->
  <!-- rendering : take the state and render it on DOM based upon the components -->

<body>
     <input type="text"></input>
     <button onclick = "addtodo()"> Add ToDo! </button>
     <div class="todos"></div>
    <script>
        let todos =[];
        function addtodo(){
            todos.push({
                title:document.querySelector("input").value
            })
            render();
        } 
        function deletetodo(){
            todos.splice(todos.length-1,1);
        }
        function deletefirsttodo(){
            todos.splice(0,1);
        }
        
        function render(){
            document.querySelector("#todos").innerHTML = "";
            for(let i =0; i<todos.length; i++){
                const todo = todos[i];
                const div = document.createElement("div");
                const h1 = document.createElement("h1");
                const button = document.createElement("button");
                button.innerHTML = "Delete";
                h1.innerHTML = todo.title;
                div.append(h1);
                div.append(button);
                document.querySelector("#todos").appendChild(div); 
            }
        }
        
    </script>
</body>
